# Overlay for validating S1' single-vote (config `singleVote: true`).
#
#   docker compose -p avalon-drills \
#     -f docker-compose.yml -f docker-compose.drills.yml \
#     -f docker-compose.drills-single-vote.yml up -d
#
# A node casts at most one hash per (height, phase), for the deterministic best
# candidate, so two colliding blocks cannot each gather a quorum. Used by the
# drill runs to check it does not freeze normal operation or the halt recovery.
#
# S1' single-vote is consensus config, not a per-node env var (a lone node
# flipping it would refuse its own votes and diverge). So instead of setting an
# env per service we ask the overlay generator to write `singleVote: true` into
# the shared config overlay (patch-config-testnet.js) — every drill node reads
# the same value from the same file.

services:
  bootstrap:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  setup:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  miner1:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  miner2:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  miner3:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  miner4:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  miner5:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  standby1:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
  standby2:
    environment:
      LAYER_SH_SINGLE_VOTE: "1"
